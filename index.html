<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>롤랑가로스 테니스 대결</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #1a202c;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* 게임 컨테이너 (롤랑가로스 클레이 코트) */
        #game-container {
            position: relative;
            width: 600px;
            height: 700px;
            background-color: #d35400; /* 클레이 코트 붉은 흙 */
            background-image: linear-gradient(135deg, rgba(255,255,255,0.05) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0.05) 75%, transparent 75%, transparent);
            background-size: 100px 100px;
            border: 6px solid #873600;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* 코트 라인 */
        .line { position: absolute; background-color: white; box-shadow: 0 0 2px rgba(0,0,0,0.3); }
        .doubles-sideline-left { width: 4px; height: 100%; top: 0; left: 50px; }
        .doubles-sideline-right { width: 4px; height: 100%; top: 0; right: 50px; }
        .singles-sideline-left { width: 4px; height: 100%; top: 0; left: 100px; }
        .singles-sideline-right { width: 4px; height: 100%; top: 0; right: 100px; }
        .baseline-top { width: calc(100% - 200px); height: 4px; top: 100px; left: 100px; }
        .baseline-bottom { width: calc(100% - 200px); height: 4px; bottom: 100px; left: 100px; }
        .service-line-top { width: calc(100% - 200px); height: 4px; top: 250px; left: 100px; }
        .service-line-bottom { width: calc(100% - 200px); height: 4px; bottom: 250px; left: 100px; }
        .center-line { width: 4px; height: calc(100% - 500px); top: 250px; left: 50%; transform: translateX(-50%); }
        .service-center-line { width: 4px; height: 100px; top: 50%; left: 50%; transform: translate(-50%, -50%); }

        /* 🌟 네트 (가운데) */
        #net {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 12px;
            transform: translateY(-50%);
            /* 네트의 그물망(메쉬) 패턴을 CSS로 표현 */
            background: repeating-linear-gradient(
                45deg,
                rgba(255, 255, 255, 0.4),
                rgba(255, 255, 255, 0.4) 2px,
                transparent 2px,
                transparent 6px
            ), rgba(0, 0, 0, 0.3);
            border-top: 3px solid white;
            border-bottom: 3px solid white;
            z-index: 4; /* 공보다 위에 있어서 가끔 공을 가림 (입체감) */
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        /* 네트 기둥 */
        #net::before, #net::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 24px;
            background-color: #cbd5e1;
            top: -6px;
            border-radius: 2px;
        }
        #net::before { left: 0; }
        #net::after { right: 0; }

        /* 🌟 캐릭터 (사람 + 라켓) */
        .player-character {
            position: absolute;
            width: 100px;
            height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }
        #ai-character { top: 15px; left: 250px; }
        #player-character { top: 605px; left: 250px; }

        .person { font-size: 45px; line-height: 1; }
        .racket { font-size: 30px; line-height: 1; margin-top: -10px; transform-origin: 50% 80%; }
        #ai-character .racket { transform: rotate(180deg); margin-top: 0; margin-bottom: -10px; order: -1; }

        /* 스윙 동작 */
        #player-character.swing .racket { animation: swing-player 0.22s ease-out; }
        #ai-character.swing .racket { animation: swing-ai 0.22s ease-out; }
        @keyframes swing-player {
            0%   { transform: rotate(0deg); }
            40%  { transform: rotate(-75deg) scale(1.25); }
            100% { transform: rotate(0deg); }
        }
        @keyframes swing-ai {
            0%   { transform: rotate(180deg); }
            40%  { transform: rotate(255deg) scale(1.25); }
            100% { transform: rotate(180deg); }
        }

        /* 서브 안내 문구 */
        #serve-msg {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, 30px);
            padding: 8px 18px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1em;
            color: #fefcbf;
            white-space: nowrap;
            z-index: 8;
            pointer-events: none;
        }
        #serve-msg.hidden { display: none; }

        /* 공 (테니스 공) */
        #ball {
            position: absolute;
            width: 24px;
            height: 24px;
            background-color: #d4e157;
            border-radius: 50%;
            box-shadow: inset -4px -4px 8px rgba(0,0,0,0.3), 0 0 10px rgba(212, 225, 87, 0.6);
            z-index: 6;
            background-image: radial-gradient(circle at 30% 30%, transparent 40%, rgba(255,255,255,0.8) 45%, transparent 50%);
        }

        /* UI 레이어 */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 10;
        }

        #ui-layer.hidden { display: none; }

        .panel {
            text-align: center;
            padding: 30px;
            background: #2d3748;
            border-radius: 12px;
            border: 2px solid #4a5568;
            width: 80%;
        }

        h1 { margin-bottom: 20px; color: #ecc94b; font-size: 1.8em; }
        p { margin-bottom: 15px; line-height: 1.6; font-size: 1.1em; }

        .difficulty-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 25px;
        }
        .diff-btn {
            padding: 12px 20px;
            font-size: 1em;
            font-weight: bold;
            border: 2px solid #4a5568;
            background: #1a202c;
            color: #a0aec0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .diff-btn:hover { background: #4a5568; color: white; }
        .diff-btn.active { background: #38a169; color: white; border-color: #38a169; }

        .action-btn {
            padding: 15px 30px;
            font-size: 1.2em;
            font-weight: bold;
            color: white;
            background-color: #3182ce;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }
        .action-btn:hover { background-color: #2b6cb0; }

        /* 🌟 점수판 (테니스 규칙 적용) */
        #scoreboard {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.85); /* 검은색 전광판 */
            padding: 10px 40px;
            border-radius: 8px;
            border: 2px solid #f1c40f;
            font-size: 3em;
            font-weight: bold;
            color: #f1c40f; /* 노란색 불빛 */
            font-family: 'Courier New', Courier, monospace;
            z-index: 8;
            display: flex;
            gap: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5), 0 0 20px rgba(241, 196, 15, 0.2);
        }
        
        /* 점수판 구분선 */
        .score-divider {
            color: #a0aec0;
            font-size: 0.8em;
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- 코트 라인 -->
        <div class="line doubles-sideline-left"></div>
        <div class="line doubles-sideline-right"></div>
        <div class="line singles-sideline-left"></div>
        <div class="line singles-sideline-right"></div>
        <div class="line baseline-top"></div>
        <div class="line baseline-bottom"></div>
        <div class="line service-line-top"></div>
        <div class="line service-line-bottom"></div>
        <div class="line center-line"></div>
        <div class="line service-center-line"></div>

        <!-- 🌟 네트 추가 -->
        <div id="net"></div>

        <!-- 점수판 -->
        <div id="scoreboard">
            <span id="player-score">0</span> 
            <span class="score-divider">-</span> 
            <span id="ai-score">0</span>
        </div>

        <!-- 캐릭터 -->
        <div class="player-character" id="ai-character">
            <div class="person">🧍‍♂️</div>
            <div class="racket">🏸</div>
        </div>

        <div class="player-character" id="player-character">
            <div class="person">🧍‍♂️</div>
            <div class="racket">🏸</div>
        </div>

        <!-- 공 -->
        <div id="ball"></div>

        <!-- 서브 안내 -->
        <div id="serve-msg" class="hidden"></div>
    </div>

    <!-- UI 레이어 -->
    <div id="ui-layer">
        <div class="panel" id="start-panel">
            <h1>🎾 롤랑가로스 테니스</h1>
            <p>방향키 <strong>↑ ↓ ← →</strong> 로 아래쪽 선수를 움직이고,<br><strong>스페이스바</strong>로 라켓을 휘둘러 공을 치세요!</p>
            <p>점수를 딴 쪽이 다음 서브를 넣습니다.<br>내 서브일 땐 스페이스바를 누르면 서브!</p>
            <p>실제 테니스 점수(0, 15, 30, 40)로 진행됩니다.</p>
            <p>40점에서 한 점을 더 얻으면 승리!</p>
            
            <p style="margin-top:20px; color:#a0aec0;">컴퓨터 난이도를 선택하세요:</p>
            <div class="difficulty-group">
                <button class="diff-btn active" data-diff="easy">쉬움</button>
                <button class="diff-btn" data-diff="normal">보통</button>
                <button class="diff-btn" data-diff="hard">어려움</button>
            </div>

            <button class="action-btn" id="start-btn">경기 시작</button>
        </div>
        
        <div class="panel" id="end-panel" style="display: none;">
            <h1 id="result-title" style="color: #48bb78;">🎉 승리했습니다!</h1>
            <p>최종 스코어: <strong id="final-player">0</strong> - <strong id="final-ai">0</strong></p>
            <button class="action-btn" id="restart-btn" style="background-color:#38a169;">다시 도전</button>
        </div>
    </div>

    <script>
        const container = document.getElementById('game-container');
        const playerCharacter = document.getElementById('player-character');
        const aiCharacter = document.getElementById('ai-character');
        const ball = document.getElementById('ball');
        const playerScoreEl = document.getElementById('player-score');
        const aiScoreEl = document.getElementById('ai-score');
        const uiLayer = document.getElementById('ui-layer');
        const startPanel = document.getElementById('start-panel');
        const endPanel = document.getElementById('end-panel');
        const resultTitle = document.getElementById('result-title');
        const finalPlayer = document.getElementById('final-player');
        const finalAi = document.getElementById('final-ai');
        const serveMsg = document.getElementById('serve-msg');

        let isPlaying = false;
        // 'serve' = 서브 대기 중, 'rally' = 공이 움직이는 중
        let phase = 'serve';
        // 다음 서브를 넣을 사람 ('player' 또는 'ai') — 직전 점수를 딴 쪽
        let server = 'player';
        let aiServeAt = 0;

        // 🌟 테니스 점수 시스템 (0, 15, 30, 40)
        const tennisScores = ["0", "15", "30", "40"];
        let playerScoreIndex = 0; // 0 -> 0점, 3 -> 40점
        let aiScoreIndex = 0;

        // 코트 크기와 위치 값
        const COURT_W = 600;
        const COURT_H = 700;
        const SIDE = 50;                 // 바깥 사이드라인 위치
        const NET_Y = COURT_H / 2;
        const charWidth = 100;
        const charHeight = 80;
        const AI_Y = 15;
        const PLAYER_START_Y = COURT_H - 15 - charHeight;
        const PLAYER_MIN_Y = NET_Y + 15;   // 네트를 넘어가지 못함
        const PLAYER_MAX_Y = COURT_H - charHeight - 5;
        const aiRacketY = AI_Y + charHeight - 40;

        let playerX = 250;
        let playerY = PLAYER_START_Y;
        let aiX = 250;
        const keys = { left: false, right: false, up: false, down: false };

        let ballX, ballY;
        let ballSpeedX = 0, ballSpeedY = 0;
        let rallySpeed = 0;
        const ballRadius = 12;

        // 스윙: 스페이스바를 누른 뒤 잠깐 동안만 공을 칠 수 있음
        const SWING_ACTIVE_MS = 220;
        const SWING_COOLDOWN_MS = 380;
        let lastPlayerSwing = -Infinity;

        // 🌟 난이도: 공 속도, 내 캐릭터 속도, 컴퓨터 속도가 모두 달라짐
        const difficultySettings = {
            easy:   { ballSpeed: 5,   maxBallSpeed: 9,  playerSpeed: 6,  aiSpeed: 3.5 },
            normal: { ballSpeed: 7,   maxBallSpeed: 12, playerSpeed: 8,  aiSpeed: 6   },
            hard:   { ballSpeed: 9.5, maxBallSpeed: 16, playerSpeed: 10, aiSpeed: 9.5 }
        };
        // 화면에 처음 선택돼 있는 버튼(쉬움)과 맞춤
        let currentDifficulty = 'easy';

        const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

        // 키 조작
        const keyMap = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
        window.addEventListener('keydown', (e) => {
            if (!isPlaying) return;
            if (keyMap[e.key]) {
                keys[keyMap[e.key]] = true;
                e.preventDefault();
            }
            if (e.code === 'Space') {
                e.preventDefault(); // 화면 스크롤·버튼 눌림 방지
                if (!e.repeat) onSpace();
            }
        });
        window.addEventListener('keyup', (e) => {
            if (keyMap[e.key]) keys[keyMap[e.key]] = false;
        });

        function onSpace() {
            if (phase === 'serve') {
                if (server === 'player') playerServe();
                return;
            }
            const now = performance.now();
            if (now - lastPlayerSwing < SWING_COOLDOWN_MS) return;
            lastPlayerSwing = now;
            playSwing(playerCharacter);
        }

        function playSwing(character) {
            character.classList.remove('swing');
            void character.offsetWidth; // 애니메이션 다시 시작
            character.classList.add('swing');
        }

        // 난이도 선택
        document.querySelectorAll('.diff-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentDifficulty = e.target.dataset.diff;
            });
        });

        // 서브 준비: 선수들을 제자리로 보내고 공을 서버 앞에 둠
        function setupServe() {
            phase = 'serve';
            ballSpeedX = 0;
            ballSpeedY = 0;
            playerX = 250;
            playerY = PLAYER_START_Y;
            aiX = 250;
            lastPlayerSwing = -Infinity;
            placeBallAtServer();

            if (server === 'player') {
                serveMsg.textContent = '내 서브! 스페이스바를 눌러 서브하세요';
            } else {
                serveMsg.textContent = '컴퓨터 서브 준비 중...';
                aiServeAt = performance.now() + 1200;
            }
            serveMsg.classList.remove('hidden');
        }

        function placeBallAtServer() {
            if (server === 'player') {
                ballX = playerX + charWidth / 2 - ballRadius;
                ballY = playerY - ballRadius * 2;
            } else {
                ballX = aiX + charWidth / 2 - ballRadius;
                ballY = AI_Y + charHeight;
            }
        }

        function launchServe(goingUp) {
            const s = difficultySettings[currentDifficulty];
            rallySpeed = s.ballSpeed;
            ballSpeedY = goingUp ? -rallySpeed : rallySpeed;
            ballSpeedX = (Math.random() - 0.5) * rallySpeed * 0.8;
            phase = 'rally';
            serveMsg.classList.add('hidden');
        }

        function playerServe() {
            lastPlayerSwing = performance.now();
            playSwing(playerCharacter);
            launchServe(true);
        }

        function aiServe() {
            playSwing(aiCharacter);
            launchServe(false);
        }

        // 공을 쳐서 돌려보냄 — 라켓의 어느 부분에 맞았는지에 따라 각도가 바뀜
        function hitBall(byPlayer, hitterX) {
            const s = difficultySettings[currentDifficulty];
            rallySpeed = Math.min(rallySpeed * 1.05, s.maxBallSpeed);
            const hitPos = clamp((ballX + ballRadius - hitterX) / charWidth, 0, 1);
            ballSpeedX = rallySpeed * (hitPos - 0.5) * 1.6;
            ballSpeedY = byPlayer ? -rallySpeed : rallySpeed;
        }

        let lastTime = 0;
        function updateGame(time) {
            if (!isPlaying) return;

            // 모니터 주사율(60Hz/120Hz 등)과 상관없이 같은 속도로 움직이게 보정
            const dt = lastTime ? Math.min((time - lastTime) / (1000 / 60), 3) : 1;
            lastTime = time;
            const now = performance.now();
            const s = difficultySettings[currentDifficulty];

            // 플레이어 이동 (상하좌우)
            const step = s.playerSpeed * dt;
            if (keys.left) playerX -= step;
            if (keys.right) playerX += step;
            if (keys.up) playerY -= step;
            if (keys.down) playerY += step;
            playerX = clamp(playerX, SIDE, COURT_W - charWidth - SIDE);
            playerY = clamp(playerY, PLAYER_MIN_Y, PLAYER_MAX_Y);

            if (phase === 'serve') {
                // 서브 전에는 공이 서버를 따라다님
                placeBallAtServer();
                if (server === 'ai' && now >= aiServeAt) aiServe();
            } else {
                // 공 이동
                ballX += ballSpeedX * dt;
                ballY += ballSpeedY * dt;

                // 좌우 벽 충돌
                const maxBallX = COURT_W - SIDE - ballRadius * 2;
                if (ballX <= SIDE || ballX >= maxBallX) {
                    ballSpeedX *= -1;
                    ballX = clamp(ballX, SIDE, maxBallX);
                }

                // 플레이어: 스윙 중이고 공이 라켓 범위 안에 있을 때만 맞음
                const swinging = now - lastPlayerSwing < SWING_ACTIVE_MS;
                const ballCX = ballX + ballRadius;
                const ballCY = ballY + ballRadius;
                if (swinging && ballSpeedY > 0 &&
                    ballCX >= playerX - 10 && ballCX <= playerX + charWidth + 10 &&
                    ballCY >= playerY - 15 && ballCY <= playerY + charHeight) {
                    hitBall(true, playerX);
                }

                // 컴퓨터 라켓 충돌 (컴퓨터는 공이 닿으면 자동으로 스윙)
                if (ballSpeedY < 0 &&
                    ballY <= aiRacketY + ballRadius && ballY >= aiRacketY - ballRadius * 3 &&
                    ballX + ballRadius * 2 >= aiX + 10 &&
                    ballX <= aiX + charWidth - 10) {
                    playSwing(aiCharacter);
                    ballY = aiRacketY + ballRadius;
                    hitBall(false, aiX);
                }

                // 🌟 득점 처리 — 점수를 딴 쪽이 다음 서브
                if (ballY > COURT_H) {
                    aiScoreIndex++;
                    server = 'ai';
                    updateScoreboard();
                    if (aiScoreIndex >= 4) { gameOver(false); return; }
                    setupServe();
                } else if (ballY < -ballRadius * 2) {
                    playerScoreIndex++;
                    server = 'player';
                    updateScoreboard();
                    if (playerScoreIndex >= 4) { gameOver(true); return; }
                    setupServe();
                }
            }

            // 컴퓨터 이동 (공을 따라감)
            const aiStep = s.aiSpeed * dt;
            if (!(phase === 'serve' && server === 'ai')) {
                const targetX = ballX - charWidth / 2 + ballRadius;
                if (aiX < targetX - 10) aiX += Math.min(aiStep, targetX - aiX);
                else if (aiX > targetX + 10) aiX -= Math.min(aiStep, aiX - targetX);
            }
            aiX = clamp(aiX, SIDE, COURT_W - charWidth - SIDE);

            render();
            requestAnimationFrame(updateGame);
        }

        function render() {
            playerCharacter.style.left = playerX + 'px';
            playerCharacter.style.top = playerY + 'px';
            aiCharacter.style.left = aiX + 'px';
            ball.style.left = ballX + 'px';
            ball.style.top = ballY + 'px';
        }

        // 🌟 점수판 업데이트 함수
        function updateScoreboard() {
            // 4점 이상(승리)일 때 인덱스 초과 방지
            let pDisplay = playerScoreIndex < 4 ? tennisScores[playerScoreIndex] : "승리";
            let aDisplay = aiScoreIndex < 4 ? tennisScores[aiScoreIndex] : "승리";
            playerScoreEl.innerText = pDisplay;
            aiScoreEl.innerText = aDisplay;
        }

        function startGame() {
            // 버튼에 포커스가 남아 있으면 스페이스바가 버튼을 다시 누르므로 해제
            if (document.activeElement) document.activeElement.blur();

            isPlaying = true;
            playerScoreIndex = 0; // 점수 초기화
            aiScoreIndex = 0;
            updateScoreboard();
            keys.left = keys.right = keys.up = keys.down = false;

            server = 'player'; // 첫 서브는 플레이어
            setupServe();
            render();

            uiLayer.classList.add('hidden');
            startPanel.style.display = 'none';
            endPanel.style.display = 'none';

            lastTime = 0;
            requestAnimationFrame(updateGame);
        }

        function gameOver(isPlayerWin) {
            isPlaying = false;
            serveMsg.classList.add('hidden');

            // 최종 스코어 표시 (40 또는 승리)
            finalPlayer.innerText = isPlayerWin ? "승리" : tennisScores[playerScoreIndex];
            finalAi.innerText = isPlayerWin ? tennisScores[aiScoreIndex] : "승리";

            uiLayer.classList.remove('hidden');
            endPanel.style.display = 'block';
            startPanel.style.display = 'none';

            if (isPlayerWin) {
                resultTitle.innerText = "🎉 승리했습니다!";
                resultTitle.style.color = "#48bb78";
            } else {
                resultTitle.innerText = "😢 패배했습니다...";
                resultTitle.style.color = "#f56565";
            }
        }

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', () => {
            startPanel.style.display = 'block';
            endPanel.style.display = 'none';
            uiLayer.classList.remove('hidden');
        });

        // 처음 화면에서도 공·선수 위치를 그려 둠
        server = 'player';
        placeBallAtServer();
        render();
    </script>
</body>
</html>
